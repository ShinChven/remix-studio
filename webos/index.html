<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Remix Studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #09090b; color: #a1a1aa; font: 32px sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; }
</style>
</head>
<body>
<div id="status">Remix Studio</div>
<script>
  // A hosted app: the TV opens the server's TV mode, so the app never needs
  // an update when Remix Studio does. scripts/package-webos.mjs writes the URL.
  var TV_URL = '__REMIX_STUDIO_TV_URL__';
  if (TV_URL.indexOf('__') === 0) {
    document.getElementById('status').textContent = 'Run scripts/package-webos.mjs --url https://your-server to set the server address.';
  } else {
    window.location.replace(TV_URL);
  }
</script>
</body>
</html>
